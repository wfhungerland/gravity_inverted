[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gravity-inverted"
version = "0.1.0"
description = "Inverted gravity: the trade cost changes that deliver welfare and trade-flow targets (Anderson, Larch and Yotov 2026)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.1"]

[project.optional-dependencies]
app = ["streamlit>=1.40", "plotly>=5.20"]
data = ["pyreadr>=0.5"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gravity_inverted = ["data/*.csv.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
